name: Pipeline Segmentation Drive & Sync Brevo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # Tous les jours à 3h du matin

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 2. Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn sib-api-v3-sdk gdown python-dotenv
          pip install pandas numpy scikit-learn sib-api-v3-sdk gdown python-dotenv openpyxl

      - name: 4. Exécuter la Segmentation Profonde (Script 02)
        env:
          DRIVE_ID_RFM: ${{ secrets.DRIVE_ID_RFM }}
          DRIVE_ID_TRANS: ${{ secrets.DRIVE_ID_TRANS }}
          DRIVE_ID_PROD: ${{ secrets.DRIVE_ID_PROD }}
        run: python 02_segmentation_profonde.py

      - name: 5. Synchroniser vers Brevo (Script 03)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python 03_synchronisation__brevo.py
